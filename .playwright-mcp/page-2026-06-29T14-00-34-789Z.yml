        - generic [ref=e376]:
          - generic [ref=e377]: FAQ
          - heading "Frequently Asked Questions" [level=2] [ref=e378]
        - generic [ref=e379]:
          - generic [ref=e380]:
            - heading "Where are you located?" [level=3] [ref=e381]
            - generic [ref=e382]: We have locations all over the globe. You can find your local park using our <a href="/"><strong>park locator</strong></a>.
          - generic [ref=e383]:
            - heading "Are Aero socks required?" [level=3] [ref=e384]
            - generic [ref=e385]: All of our Ontario locations require Aero socks to jump in the trampoline park, each park has Aero Socks on hand to sell. Aero socks are reusable so be sure to keep yours for future visits!
          - generic [ref=e386]:
            - heading "Do you have a weight limit?" [level=3] [ref=e387]
            - generic [ref=e388]: Our trampolines have a 300 pound weight limit.
          - generic [ref=e389]:
            - heading "Are waivers required? Can they be filled out online?" [level=3] [ref=e390]
            - generic [ref=e391]: Waivers are required for every guest to the park including non-jumpers. By clicking on the ‘Online Waiver’ tab, you can fill out the waiver to jump before you go! This will reduce your check-in time, and keep you from waiting in a second line. Keep in mind the waiver needs to be done by a parent or legal guardian for children less than 18 years old. Everyone who enters the facility MUST have a waiver on file with that park.
          - generic [ref=e392]:
            - heading "Can I leave my child(ren) unattended?" [level=3] [ref=e393]
            - generic [ref=e394]: While every child under 18 needs a parent or legal guardian to sign the waiver, children under 10 years old cannot be dropped off without an adult. Please ensure all children understand the rules and regulations of the park before dropping them off to jump. If your child is enrolled and participating in Summer Camp where they will have a staff member present interacting with them at all times they may be dropped off if they are 5 or older.
          - generic [ref=e395]:
            - heading "Do spectators have to pay to watch jumpers?" [level=3] [ref=e396]
            - generic [ref=e397]: While jumpers are required to pay general admission, non-jumpers are never charged admission. During toddler time, one parent or guardian may jump free.
          - generic [ref=e398]:
            - heading "What can smaller/younger children do at your parks?" [level=3] [ref=e399]
            - generic [ref=e400]: Some Aerosports locations have a special jumping area for little jumper! All ages are welcome at Aerosports, as long as your child can walk they can jump. Toddler jumpers also have access to the entire park. \
          - generic [ref=e401]:
            - heading "What do you have at your parks for older kids/teens?" [level=3] [ref=e402]
            - generic [ref=e403]: Older kids and teens are challenged by our ninja obstacle course, dunk lanes, and dodgeball. &nbsp;We also have Aerosports Glow every Friday and Saturday night from 7 to 10PM, jumpers older than 9 years old can jump and play in a dance environment complete with party lights and music!
